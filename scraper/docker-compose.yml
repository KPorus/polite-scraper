services:
  postgres:
    image: postgres:16-alpine
    container_name: polite-scraper-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: books
    volumes:
      - scraper_pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d books"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scraper_pg_data:
